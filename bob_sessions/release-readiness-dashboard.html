<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bob Release Guard - Atlas View</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(17, 24, 39, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --safe: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      
      --node-root: #e2e8f0;
      --node-agent: #3b82f6;
      --node-safe: #10b981;
      --node-danger: #ef4444;
      --link-color: rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
    }

    #d3-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: linear-gradient(180deg, rgba(11, 15, 25, 0.9) 0%, rgba(11, 15, 25, 0) 100%);
      z-index: 10;
      pointer-events: none;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .logo-svg {
      width: 24px;
      height: 24px;
      fill: var(--accent);
    }

    .status-pill {
      margin-left: auto;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
      border: 1px solid var(--border-color);
    }
    .status-blocked {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.5);
    }
    .status-safe {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.5);
    }

    .sidebar {
      position: absolute;
      right: 24px;
      top: 88px;
      bottom: 24px;
      width: 400px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .score-container {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .score-value {
      font-size: 48px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .score-max {
      font-size: 18px;
      color: var(--text-muted);
    }

    .score-label {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    
    /* Custom Scrollbar for sidebar */
    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .blocker-item, .fix-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .blocker-item {
      border-left: 4px solid var(--danger);
    }
    
    .fix-item {
      border-left: 4px solid var(--warning);
    }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .item-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .item-agent {
      display: inline-block;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .d3-tooltip {
      position: absolute;
      text-align: center;
      padding: 8px 12px;
      font: 12px 'JetBrains Mono', monospace;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 20;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-content">
      <div class="spinner"></div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;">Initializing Atlas View...</div>
    </div>
  </div>

  <svg id="d3-canvas"></svg>

  <nav class="top-nav">
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      Bob Release Guard
    </div>
    <div id="header-status" class="status-pill">ANALYZING</div>
  </nav>

  <aside class="sidebar">
    <header class="sidebar-header">
      <div class="score-container">
        <div id="overall-score" class="score-value">--</div>
        <div class="score-max">/ 100</div>
      </div>
      <div class="score-label">Release Readiness Score</div>
    </header>
    <div class="sidebar-content">
      <div id="blockers-section" style="display: none;">
        <div class="section-title">Critical Blockers (<span id="blocker-count">0</span>)</div>
        <div id="blockers-list"></div>
      </div>
      
      <div id="fixes-section" style="margin-top: 32px; display: none;">
        <div class="section-title">Required Fixes</div>
        <div id="fixes-list"></div>
      </div>
    </div>
  </aside>
  
  <div id="tooltip" class="d3-tooltip"></div>

  <script>
    const FALLBACK_DATA = {
      "commit": "177dc6a",
      "status": "BLOCKED",
      "overallScore": 42,
      "summary": "Database schema mismatch detected. The column 'emailAddress' is expected but code references 'email'.",
      "blockers": [
        {
          "agent": "Schema Agent",
          "severity": "HIGH",
          "description": "Migration file 20231015-rename-email-to-emailAddress.js conflicts with user.js and userController.js which still use 'email'.",
          "file": "userController.js"
        },
        {
          "agent": "Dependency Agent",
          "severity": "HIGH",
          "description": "Package 'pg' version 8.11.0 has a known critical vulnerability. Update to 8.11.3 required.",
          "file": "package.json"
        }
      ],
      "requiredFixes": [
        {
          "agent": "Schema Agent",
          "action": "Update 'user.js' and 'userController.js' to use 'emailAddress' instead of 'email'."
        },
        {
          "agent": "Dependency Agent",
          "action": "Run 'npm install pg@8.11.3'."
        }
      ]
    };

    async function loadData() {
      try {
        const response = await fetch('/report.json');
        if (!response.ok) throw new Error('Network error');
        return await response.json();
      } catch (e) {
        try {
          const response2 = await fetch('./report.json');
          if (!response2.ok) throw new Error('Network error');
          return await response2.json();
        } catch (e2) {
          console.warn('Using fallback data');
          return FALLBACK_DATA;
        }
      }
    }

    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }

    function renderUI(data) {
      // Score
      const scoreEl = document.getElementById('overall-score');
      if (scoreEl) {
        scoreEl.textContent = data.overallScore || 0;
        scoreEl.style.color = data.overallScore > 80 ? 'var(--safe)' : (data.overallScore > 50 ? 'var(--warning)' : 'var(--danger)');
      }

      // Status
      const statusEl = document.getElementById('header-status');
      if (statusEl) {
        statusEl.textContent = data.status || 'UNKNOWN';
        if (data.status === 'SAFE') {
          statusEl.className = 'status-pill status-safe';
        } else if (data.status === 'BLOCKED') {
          statusEl.className = 'status-pill status-blocked';
        } else {
          statusEl.className = 'status-pill';
        }
      }

      // Blockers
      const blockersSection = document.getElementById('blockers-section');
      const blockersList = document.getElementById('blockers-list');
      const blockerCount = document.getElementById('blocker-count');
      if (data.blockers && data.blockers.length > 0 && blockersSection && blockersList && blockerCount) {
        blockersSection.style.display = 'block';
        blockerCount.textContent = data.blockers.length;
        blockersList.innerHTML = data.blockers.map(b => `
          <div class="blocker-item">
            <div class="item-title">${b.severity} Blocker</div>
            <div class="item-desc">${b.description}</div>
            <div class="item-agent">${b.agent} • ${b.file || 'System'}</div>
          </div>
        `).join('');
      }

      // Fixes
      const fixesSection = document.getElementById('fixes-section');
      const fixesList = document.getElementById('fixes-list');
      if (data.requiredFixes && data.requiredFixes.length > 0 && fixesSection && fixesList) {
        fixesSection.style.display = 'block';
        fixesList.innerHTML = data.requiredFixes.map(f => `
          <div class="fix-item">
            <div class="item-title">Suggested Action</div>
            <div class="item-desc">${f.action}</div>
            <div class="item-agent">${f.agent}</div>
          </div>
        `).join('');
      }
    }

    function buildGraphData(data) {
      const nodes = [];
      const links = [];
      
      const commitId = data.commit || 'HEAD';
      
      nodes.push({ id: 'commit', label: 'Commit ' + commitId, group: 'root', radius: 30 });
      
      const agents = ['Schema Agent', 'Config Agent', 'Dependency Agent', 'Rollback Agent'];
      
      agents.forEach(agent => {
        const agentId = 'agent_' + agent.replace(/\s+/g, '');
        nodes.push({ id: agentId, label: agent, group: 'agent', radius: 20 });
        links.push({ source: 'commit', target: agentId, value: 2 });
      });

      // Extract files from blockers to connect to agents
      if (data.blockers) {
        data.blockers.forEach((b, i) => {
          if (b.file) {
            const fileId = 'file_' + i;
            const agentId = 'agent_' + b.agent.replace(/\s+/g, '');
            
            nodes.push({ 
              id: fileId, 
              label: b.file, 
              group: b.severity === 'HIGH' ? 'danger' : 'warning',
              radius: 15,
              desc: b.description
            });
            
            // Connect agent to file
            const agentExists = nodes.find(n => n.id === agentId);
            links.push({ source: agentExists ? agentId : 'commit', target: fileId, value: 1 });
          }
        });
      }

      // Add a dummy safe file for visual flavor
      nodes.push({ id: 'safe_1', label: 'README.md', group: 'safe', radius: 10 });
      links.push({ source: 'agent_ConfigAgent', target: 'safe_1', value: 1 });
      
      return { nodes, links };
    }

    function renderD3(data) {
      const graphData = buildGraphData(data);
      
      const width = window.innerWidth;
      const height = window.innerHeight;

      const svg = d3.select("#d3-canvas")
        .attr("viewBox", [0, 0, width, height]);
        
      const g = svg.append("g");
      
      // Setup Zoom
      const zoom = d3.zoom()
        .scaleExtent([0.5, 4])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        });
        
      svg.call(zoom);

      const simulation = d3.forceSimulation(graphData.nodes)
        .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-500))
        .force("center", d3.forceCenter(width / 2 - 100, height / 2))
        .force("collide", d3.forceCollide().radius(d => d.radius + 10));

      // Glow filter
      const defs = svg.append("defs");
      const filter = defs.append("filter")
          .attr("id", "glow");
      filter.append("feGaussianBlur")
          .attr("stdDeviation", "3")
          .attr("result", "coloredBlur");
      const feMerge = filter.append("feMerge");
      feMerge.append("feMergeNode").attr("in", "coloredBlur");
      feMerge.append("feMergeNode").attr("in", "SourceGraphic");

      const link = g.append("g")
        .attr("stroke", "var(--link-color)")
        .attr("stroke-opacity", 0.6)
        .selectAll("line")
        .data(graphData.links)
        .join("line")
        .attr("stroke-width", d => Math.sqrt(d.value) * 1.5);

      const nodeGroup = g.append("g")
        .selectAll(".node")
        .data(graphData.nodes)
        .join("g")
        .attr("class", "node")
        .call(drag(simulation));
        
      const tooltip = d3.select("#tooltip");

      nodeGroup.append("circle")
        .attr("r", d => d.radius)
        .attr("fill", d => {
          if (d.group === 'root') return "var(--node-root)";
          if (d.group === 'agent') return "var(--node-agent)";
          if (d.group === 'danger') return "var(--node-danger)";
          if (d.group === 'warning') return "var(--warning)";
          return "var(--node-safe)";
        })
        .style("filter", "url(#glow)")
        .on("mouseover", (event, d) => {
          tooltip.transition().duration(200).style("opacity", 1);
          tooltip.html(`<strong>${d.label}</strong>${d.desc ? '<br/>' + d.desc : ''}`)
            .style("left", (event.pageX + 15) + "px")
            .style("top", (event.pageY - 15) + "px");
          
          d3.select(event.currentTarget).attr("stroke", "#fff").attr("stroke-width", 2);
        })
        .on("mouseout", (event, d) => {
          tooltip.transition().duration(500).style("opacity", 0);
          d3.select(event.currentTarget).attr("stroke", null);
        });

      nodeGroup.append("text")
        .text(d => d.label)
        .attr("x", d => d.radius + 8)
        .attr("y", 4)
        .style("font-family", "'JetBrains Mono', monospace")
        .style("font-size", "12px")
        .style("fill", "var(--text-main)")
        .style("pointer-events", "none")
        .style("text-shadow", "0px 2px 4px rgba(0,0,0,0.8)");

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        nodeGroup
          .attr("transform", d => `translate(${d.x},${d.y})`);
      });

      function drag(simulation) {
        function dragstarted(event) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          event.subject.fx = event.subject.x;
          event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
          event.subject.fx = event.x;
          event.subject.fy = event.y;
        }
        
        function dragended(event) {
          if (!event.active) simulation.alphaTarget(0);
          event.subject.fx = null;
          event.subject.fy = null;
        }
        
        return d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended);
      }
      
      // Initial zoom transform
      svg.call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(1));
    }

    async function init() {
      try {
        const data = await loadData();
        renderUI(data);
        renderD3(data);
      } catch (e) {
        console.error("Error initializing dashboard:", e);
      } finally {
        hideLoader();
      }
    }

    // Run on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
