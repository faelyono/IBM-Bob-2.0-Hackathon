<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bob Release Guard - Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fa;
            --text-heading: #1d1d1f;
            --text-body: #515154;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.05);
            
            --orb-cyan: #00f2fe;
            --orb-magenta: #fe0979;
            --orb-violet: #8a2be2;

            --danger: #ff4b4b;
            --danger-bg: rgba(255, 75, 75, 0.1);
            --success: #34c759;
            --success-bg: rgba(52, 199, 89, 0.1);
            --warning: #ff9f0a;
            --warning-bg: rgba(255, 159, 10, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-heading);
            font-weight: 600;
        }

        /* Holographic Orbs */
        .orb-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--orb-cyan);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--orb-magenta);
            bottom: -50px;
            right: 10%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 700px;
            height: 700px;
            background: var(--orb-violet);
            top: 40%;
            left: 30%;
            animation-delay: -10s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(100px, 50px) scale(1.1); }
            100% { transform: translate(-50px, 100px) scale(0.9); }
        }

        /* Glassmorphism Utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            min-width: 0;
        }

        /* State 1: Landing */
        #landing-state {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .logo-container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container:hover {
            transform: scale(1.05);
        }

        .logo-svg {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            animation: pulse 3s infinite ease-in-out;
            fill: none;
            stroke: var(--text-heading);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 1rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        #loading-text {
            margin-top: 40px;
            font-size: 1.1rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* State 2: Dashboard */
        #dashboard-state {
            display: none;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            margin-bottom: 32px;
            border-radius: 100px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--text-heading);
        }

        .nav-brand svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: var(--text-heading);
            stroke-width: 2;
        }

        .nav-meta {
            display: flex;
            gap: 12px;
        }

        .pill {
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Main Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        /* Hero / Score Section */
        .hero-section {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .score-ring {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 24px;
        }

        .score-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .score-bg {
            fill: none;
            stroke: rgba(0,0,0,0.05);
            stroke-width: 8;
        }

        .score-progress {
            fill: none;
            stroke: var(--success);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 565.48; /* 2 * pi * r (90) */
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .score-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-value {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-heading);
            line-height: 1;
        }

        .score-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .status-badge {
            font-size: 1.25rem;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 100px;
            display: inline-block;
        }
        
        .status-BLOCKED {
            color: var(--danger);
            background: var(--danger-bg);
        }
        
        .status-SAFE {
            color: var(--success);
            background: var(--success-bg);
        }

        /* Agents Matrix */
        .agents-matrix {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .agent-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .agent-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .agent-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .risk-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
        }

        .risk-HIGH { background: var(--danger-bg); color: var(--danger); }
        .risk-MEDIUM { background: var(--warning-bg); color: var(--warning); }
        .risk-NONE, .risk-LOW { background: var(--success-bg); color: var(--success); }

        .agent-body {
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .finding-item {
            padding: 12px;
            background: rgba(255,255,255,0.5);
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .finding-item strong {
            display: block;
            color: var(--text-heading);
            margin-bottom: 4px;
        }

        .recommendation {
            margin-top: 12px;
            font-style: italic;
            color: var(--text-heading);
        }

        /* Bottom Grid */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* Generic Panel */
        .panel {
            padding: 24px;
        }
        
        .panel-title {
            font-size: 1.25rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Rollback Panel */
        .code-window {
            background: #1d1d1f;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        .code-header {
            background: #2d2d2f;
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .mac-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .code-content {
            padding: 16px;
            color: #a9b7c6;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .code-keyword { color: #cc7832; }
        .code-string { color: #6a8759; }
        
        /* Checklist */
        .checklist {
            list-style: none;
        }
        
        .check-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .check-item:last-child {
            border-bottom: none;
        }
        
        .check-icon {
            color: var(--danger);
            flex-shrink: 0;
            margin-top: 2px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .bottom-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .agents-matrix { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 16px; border-radius: 24px; }
        }
    </style>
</head>
<body>

    <!-- Holographic Background -->
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- State 1: Landing -->
    <div id="landing-state">
        <div class="logo-container" id="init-btn">
            <svg class="logo-svg" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <h1 class="logo-title">Bob Release Guard</h1>
            <p class="logo-subtitle">Click to Initialize</p>
        </div>
        <div id="loading-text">Initializing AI Subroutines...</div>
    </div>

    <!-- State 2: Dashboard -->
    <div id="dashboard-state">
        <nav class="navbar glass">
            <div class="nav-brand">
                <svg viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Bob Release Guard
            </div>
            <div class="nav-meta" id="nav-meta">
                <!-- Pills injected by JS -->
            </div>
        </nav>

        <div class="dashboard-grid">
            <!-- Hero Score -->
            <div class="glass hero-section">
                <div class="score-ring">
                    <svg viewBox="0 0 200 200">
                        <circle class="score-bg" cx="100" cy="100" r="90"></circle>
                        <circle class="score-progress" id="score-circle" cx="100" cy="100" r="90"></circle>
                    </svg>
                    <div class="score-text-container">
                        <div class="score-value" id="score-value">0</div>
                        <div class="score-label">Score</div>
                    </div>
                </div>
                <div id="main-status" class="status-badge">Loading...</div>
            </div>

            <!-- Agents Matrix -->
            <div class="agents-matrix" id="agents-matrix">
                <!-- Cards injected by JS -->
            </div>
        </div>

        <div class="bottom-grid">
            <!-- Rollback Proof -->
            <div class="glass panel">
                <h2 class="panel-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Rollback Simulation
                </h2>
                <div class="code-window">
                    <div class="code-header">
                        <div class="mac-dot dot-red"></div>
                        <div class="mac-dot dot-yellow"></div>
                        <div class="mac-dot dot-green"></div>
                    </div>
                    <div class="code-content" id="rollback-content">
                        <!-- Code injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Required Fixes -->
            <div class="glass panel">
                <h2 class="panel-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    Required Fixes
                </h2>
                <ul class="checklist" id="fixes-list">
                    <!-- Fixes injected by JS -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        const FALLBACK_DATA = {
            "generatedAt": "2025-09-26T08:30:00.000Z",
            "commit": "177dc6a", "branch": "main", "score": 20, "status": "BLOCKED",
            "agents": {
                "schema": { "riskLevel": "HIGH", "findings": [ { "file": "user.js", "change": "renamed email", "impact": "breaking" } ], "recommendation": "Fix it" },
                "config": { "riskLevel": "NONE", "findings": [], "recommendation": "All good" },
                "dependency": { "riskLevel": "NONE", "findings": [], "recommendation": "All good" },
                "rollback": { "rollbackSafe": true, "verdict": "PASS", "executionMethod": "hybrid-manual", "branchName": "rollback-test", "verificationQuery": "SELECT *", "verificationOutput": "ok", "note": "manual proof" }
            },
            "blockers": ["Schema mismatch"],
            "requiredFixes": ["Update target-app/src/database/models/user.js", "Update controller"]
        };

        let reportData = null;

        async function loadData() {
            try {
                const res = await fetch('/report.json');
                if (!res.ok) throw new Error('Not found');
                reportData = await res.json();
            } catch (e1) {
                try {
                    const res2 = await fetch('./report.json');
                    if (!res2.ok) throw new Error('Not found');
                    reportData = await res2.json();
                } catch (e2) {
                    console.log("Using fallback data");
                    reportData = FALLBACK_DATA;
                }
            }
        }

        function getAgentIcon(name) {
            const icons = {
                'schema': '<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>',
                'config': '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>',
                'dependency': '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>',
                'rollback': '<path d="M3 2v6h6"></path><path d="M3 13a9 9 0 1 0 3-7.7L3 8"></path>'
            };
            return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icons[name.toLowerCase()] || ''}</svg>`;
        }

        function renderDashboard() {
            // Navbar
            document.getElementById('nav-meta').innerHTML = `
                <div class="pill">Commit: ${reportData.commit.substring(0,7)}</div>
                <div class="pill">Branch: ${reportData.branch}</div>
            `;

            // Score & Status
            document.getElementById('score-value').innerText = reportData.score;
            const scoreCircle = document.getElementById('score-circle');
            const circumference = 565.48;
            const offset = circumference - (reportData.score / 100) * circumference;
            
            // Set initial offset for animation
            setTimeout(() => {
                scoreCircle.style.strokeDashoffset = offset;
                if(reportData.score < 50) scoreCircle.style.stroke = 'var(--danger)';
                else if (reportData.score < 80) scoreCircle.style.stroke = 'var(--warning)';
                else scoreCircle.style.stroke = 'var(--success)';
            }, 500);

            const statusEl = document.getElementById('main-status');
            statusEl.innerText = reportData.status === 'BLOCKED' ? 'Deployment Blocked' : 'Safe for Release';
            statusEl.className = `status-badge status-${reportData.status}`;

            // Agents Matrix
            let agentsHtml = '';
            for (const [name, data] of Object.entries(reportData.agents)) {
                let riskClass = data.riskLevel ? `risk-${data.riskLevel}` : (data.rollbackSafe ? 'risk-NONE' : 'risk-HIGH');
                let riskText = data.riskLevel || (data.rollbackSafe ? 'SAFE' : 'RISK');
                
                let findingsHtml = '';
                if (data.findings && data.findings.length > 0) {
                    findingsHtml = data.findings.map(f => `
                        <div class="finding-item">
                            <strong>${f.file || 'Global'}</strong>
                            ${f.change || f.issue || ''}
                        </div>
                    `).join('');
                }

                agentsHtml += `
                    <div class="glass agent-card">
                        <div class="agent-header">
                            <div class="agent-title">
                                ${getAgentIcon(name)}
                                ${name.charAt(0).toUpperCase() + name.slice(1)}
                            </div>
                            <span class="risk-badge ${riskClass}">${riskText}</span>
                        </div>
                        <div class="agent-body">
                            ${findingsHtml}
                            <div class="recommendation">${data.recommendation || data.note || ''}</div>
                        </div>
                    </div>
                `;
            }
            document.getElementById('agents-matrix').innerHTML = agentsHtml;

            // Rollback Proof
            const rb = reportData.agents.rollback;
            if (rb) {
                let codeHtml = `<span class="code-keyword">Method:</span> <span class="code-string">${rb.executionMethod}</span>\n`;
                if(rb.verificationQuery) codeHtml += `<span class="code-keyword">Query:</span> ${rb.verificationQuery}\n`;
                if(rb.verificationOutput) codeHtml += `<span class="code-keyword">Output:</span>\n${rb.verificationOutput}\n`;
                document.getElementById('rollback-content').innerHTML = `<pre>${codeHtml}</pre>`;
            } else {
                document.getElementById('rollback-content').innerHTML = 'No rollback data available.';
            }

            // Fixes Checklist
            const fixesHtml = reportData.requiredFixes.map(fix => `
                <li class="check-item">
                    <svg class="check-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                    <span>${fix}</span>
                </li>
            `).join('');
            document.getElementById('fixes-list').innerHTML = fixesHtml || '<li class="check-item">No fixes required.</li>';
        }

        // Interaction Logic
        document.getElementById('init-btn').addEventListener('click', async () => {
            const landing = document.getElementById('landing-state');
            const dashboard = document.getElementById('dashboard-state');
            const loadingText = document.getElementById('loading-text');
            const subtitle = document.querySelector('.logo-subtitle');

            subtitle.style.display = 'none';
            loadingText.style.opacity = '1';

            // Load data during transition
            await loadData();
            renderDashboard();

            setTimeout(() => {
                landing.style.opacity = '0';
                landing.style.transform = 'scale(0.9)';
                
                setTimeout(() => {
                    landing.style.display = 'none';
                    dashboard.style.display = 'block';
                    
                    // Trigger reflow to ensure transition runs
                    void dashboard.offsetWidth; 
                    
                    dashboard.style.opacity = '1';
                    dashboard.style.transform = 'translateY(0)';
                }, 800);
            }, 1000);
        });

    </script>
</body>
</html>
